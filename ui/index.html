<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lead Enricher</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>AI Lead Enricher</h1>
                <p class="subtitle">Autonomous company research and lead intelligence</p>
            </div>
            <div class="agent-status">
                <span class="status-dot"></span>
                <span>Agent Ready</span>
            </div>
        </header>

        <main>
            <section class="card input-card">
                <div class="card-header">
                    <h2>Company Domains</h2>
                    <div class="toggle-container">
                        <span class="toggle-label">Demo Mode</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="demo-mode-toggle" checked>
                            <span class="slider"></span>
                        </label>
                        <span class="badge" id="demo-badge">ON</span>
                    </div>
                </div>
                
                <div class="input-area">
                    <textarea id="domain-input" placeholder="Enter domains (one per line)..."></textarea>
                </div>

                <div class="actions">
                    <div class="left-actions">
                        <button id="add-domain-btn" class="btn btn-secondary">+ Add Domain</button>
                        <button id="load-examples-btn" class="btn btn-secondary">Load Examples</button>
                    </div>
                    <button id="enrich-btn" class="btn btn-primary">Enrich Companies</button>
                </div>
            </section>

            <section id="agent-activity-section" class="card hidden">
                <h2>Agent Activity</h2>
                <div id="activity-container" class="activity-container"></div>
            </section>

            <section id="results-section" class="results-container"></section>
        </main>
    </div>

    <!-- Templates -->
    <template id="activity-template">
        <div class="activity-block">
            <h3 class="activity-domain"></h3>
            <ul class="activity-steps"></ul>
        </div>
    </template>

    <template id="result-template">
        <div class="card result-card">
            <div class="result-header">
                <h2 class="result-domain"></h2>
                <div class="result-status"></div>
            </div>
            
            <div class="confidence-container">
                <div class="confidence-header">
                    <span>Confidence</span>
                    <span class="confidence-value"></span>
                </div>
                <div class="confidence-bar-bg">
                    <div class="confidence-bar-fill"></div>
                </div>
            </div>

            <div class="result-body">
                <div class="section company-overview-section">
                    <h3>Company Overview</h3>
                    <p class="company-overview"></p>
                </div>
                
                <div class="section target-audience-section">
                    <h3>Target Audience / ICP</h3>
                    <p class="target-audience"></p>
                </div>
                
                <div class="section primary-contacts-section">
                    <h3>Primary Generic Contacts</h3>
                    <div class="chips primary-contacts"></div>
                </div>
                
                <div class="section other-contacts-section">
                    <h3>Other Public Contacts</h3>
                    <div class="chips other-contacts"></div>
                </div>
                
                <div class="section leadership-section">
                    <h3>Leadership</h3>
                    <div class="leadership-list"></div>
                </div>

                <div class="collapsible">
                    <button class="collapsible-btn">Agent Details ▼</button>
                    <div class="collapsible-content agent-details"></div>
                </div>

                <div class="collapsible">
                    <button class="collapsible-btn">Sources Used ▼</button>
                    <div class="collapsible-content sources-content"></div>
                </div>
            </div>
            
            <div class="error-body hidden">
                <h3>⚠ Enrichment Failed</h3>
                <p class="error-reason"></p>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
